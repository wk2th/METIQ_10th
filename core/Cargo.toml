[package]
name = "metiq_core"
version = "1.9.96"
edition = "2021"
description = "METIQ HOME PAGE rendering kernel (no_std, no allocator, no wasm-bindgen)"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.dev]
panic = "abort"
